services:
  postgres:
    image: postgres:16-alpine
    container_name: banco-piscinas
    environment:
      POSTGRES_DB: gestao_piscinas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: gestao-piscinas-api
    profiles: ["app"]  # sobe só com: docker compose --profile app up
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gestao_piscinas
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
