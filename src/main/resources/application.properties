spring.application.name=gestao-piscinas-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_piscinas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
